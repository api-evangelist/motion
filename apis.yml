aid: motion
name: Motion
description: >-
  Motion is a creative analytics platform for performance marketing and creative teams, headquartered
  in Toronto and founded in 2021 by Reza Khadjavi, Alexander Sloan, and David Berglas. Motion connects a
  brand's Meta, TikTok, YouTube, and LinkedIn ad accounts — plus Google Analytics 4 and Northbeam
  attribution — into a single command center where marketers and agencies identify which creative
  elements drive performance, run comparative and launch analysis, auto-tag ads with AI across multiple
  dimensions, and research competitor ads via its Inspo tool. The company also offers Runneth by Motion,
  an AI layer for marketing. Motion serves 2,100+ teams analyzing over $14B in annual ad spend and is
  backed by Threshold Ventures, Inovia Capital, Headline, Abstract Ventures, and Sugar Capital. Motion
  publishes no REST API, OpenAPI, GraphQL endpoint or webhook surface; its one machine-callable product
  is the Motion MCP server at https://projects.motionapp.com/mcp, a read-only OAuth 2.0 Model Context
  Protocol server exposing 13 documented tools over creative performance, video transcripts, AI tags,
  demographics, saved reports and the Inspo competitor ad library to Claude, ChatGPT, Cursor and any
  MCP client.
