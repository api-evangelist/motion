apis:
- name: Motion MCP
  description: >-
    Motion's official hosted remote MCP server. Read-only, OAuth 2.0 gated, and documented with 13
    tools across six categories — auth context, creative performance (ranked creatives, AI creative
    summaries, video transcripts, demographic breakdowns), workspace brand and competitor context,
    the Inspo competitor ad library, saved reports, and the workspace AI Tag taxonomy. Distributed
    through the Anthropic Claude connector directory and a one-click Cursor install, and connectable
    from any MCP client with the server URL alone thanks to RFC 7591 dynamic client registration.
    MCP data coverage is currently Meta only, narrower than Motion's product integrations.
  humanURL: https://motionapp.com/mcp
  baseURL: https://projects.motionapp.com/mcp
