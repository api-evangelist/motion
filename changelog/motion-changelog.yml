entries:
- date: '2025-11-10'
  title: Introducing AI Tagging
  url: https://motionapp.com/releases/introducing-ai-tagging
  type: addition
  breaking: false
  highlights:
  - >-
    AI Tagging automatically watches, analyzes and categorizes every ad in an account, surfacing
    creative patterns without naming conventions.
  - >-
    Ships a fixed 8-category taxonomy — Asset type, Visual format, Messaging angle, Hook tactic,
    Seasonality, Offer type, Intended audience, Headline tactic — refined over 100+ tests with alpha
    and beta customers.
  - New tag values are generated as new creatives launch, rather than from a static list.
  - Live in every Motion plan out of the box.
  agent_relevance: >-
    This is the taxonomy the Motion MCP's get_glossary_values tool returns, and the filter dimension
    the creative tools accept. Motion states in this release that the taxonomy was "built as a
    taxonomy that can be understood by both humans and agentic AI systems" — the MCP is the delivery
    of that stated intent.
  docs: https://help.motionapp.com/en/articles/12461770-getting-started-with-ai-tagging-in-motion
