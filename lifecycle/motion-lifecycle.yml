  api_version_header: null
  note: >-
    The Motion MCP endpoint is an unversioned URL (https://projects.motionapp.com/mcp). Motion
    publishes no API versioning policy, no MCP protocol-version pin, and no version-negotiation
    guidance. A consuming agent has no way to pin behaviour.
