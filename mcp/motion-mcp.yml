name: Motion MCP
description: Motion's official hosted, remote MCP server. It exposes Motion Creative Analytics — ad creative
  performance, AI-generated creative summaries and video transcripts, demographic breakdowns, workspace
  brand and competitor context, the Inspo competitor ad library, saved reports, and the workspace AI Tag
  taxonomy — as read-only MCP tools to any MCP-compatible client.
vendor: Motion Creative Cloud Inc.
endpoint: https://projects.motionapp.com/mcp
transport: streamable-http
landing_page: https://motionapp.com/mcp
docs: https://help.motionapp.com/en/articles/14315735-motion-mcp
in_app_location: My Account → My Integrations
distribution:
- channel: Anthropic Claude connector directory
  url: https://claude.ai/directory/connectors/motion
- channel: Cursor one-click install
  note: '"Add to Cursor" button published inside Motion under My Account → My Integrations.'
- channel: manual URL
  note: Any MCP client that accepts a server URL.
clients_documented:
- Claude (Desktop, Code, claude.ai — workspace admin must add the connector first)
- ChatGPT (Settings → Apps → Developer mode → Create App)
- Cursor
- any MCP-compatible client via command-line/JSON config
authentication:
  type: oauth2
  flow: authorization_code
  pkce: S256
  dynamic_client_registration: true
  registration_endpoint: https://projects.motionapp.com/api/auth/oauth2/register
  authorization_server: https://projects.motionapp.com/api/auth
  protected_resource_metadata: https://projects.motionapp.com/mcp/.well-known/oauth-protected-resource
  per_user: true
  note: Each user authenticates individually against their own Motion account; the AI client never receives
    or stores Motion credentials. Provider states the connection can be revoked at any time from the client's
    settings.
access_control:
  roles_permitted:
  - Owner
  - Admin
  - Collaborator
  roles_denied:
  - Guest access
  - Partner share access
  scope_of_data: All workspaces across all organizations where the authenticating user has permissions
    — the same data the user can see in the Motion app.
  read_only: true
plan_requirement: An active Motion account. Sign-up is possible during the OAuth flow and includes a 14-day
  trial. The pricing page lists "full data & MCP access" from the Starter tier ($750/mo) upward; the help
  centre notes legacy or Custom plans require an upgrade for MCP access.
data_source_coverage:
  supported:
  - Meta
  not_yet_supported:
  - TikTok
  - YouTube
  - LinkedIn
  note: Verbatim from the help centre — "Currently, Motion's MCP supports Meta only. TikTok, YouTube,
    and LinkedIn aren't available yet." Motion's product integrations are broader than its MCP coverage.
