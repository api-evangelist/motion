name: Motion — rate limits
limit_count: 0
note: >-
  Motion publishes no rate limits for the Motion MCP server — no requests-per-window figure, no
  burst allowance, no documented 429 behaviour, and no rate-limit response headers. This is an
  honest zero: the MCP help-centre article is Motion's only technical reference for the surface and
  it covers authentication, permissions, tools, troubleshooting and privacy without ever naming a
  limit. There is no other public API to document limits for.
surfaces_checked:
- url: https://projects.motionapp.com/mcp
  probe: POST tools/list, unauthenticated
  http_status: 401
  rate_limit_headers_observed: []
  headers_observed:
  - strict-transport-security
  - access-control-allow-origin
  - access-control-expose-headers
  - www-authenticate
  - x-request-id
  - x-powered-by
  - cf-cache-status
  - cf-ray
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header appears on the unauthenticated 401. Whether
    limits are signalled on authenticated responses could not be observed — the surface is OAuth
    gated and we hold no credentials.
