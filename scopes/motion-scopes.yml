  description: Read access to documents in the Motion app.
  inferred: true
  advertised_on:
  - authorization-server
- scope: documents:write
  description: Write access to documents in the Motion app.
  inferred: true
  advertised_on:
  - authorization-server
- scope: runneth:documents:read
