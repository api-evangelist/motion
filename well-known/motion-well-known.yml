method: probed
source: live unauthenticated HTTP probes of every Motion host named in apis.yml
name: Motion — /.well-known discovery probe
note: >-
  Motion serves real RFC 8414 / RFC 9728 discovery documents on projects.motionapp.com, the host that
  runs the Motion MCP server (https://projects.motionapp.com/mcp) and the Motion/Runneth app. The
  marketing host motionapp.com serves a Webflow catch-all that answers every /.well-known/* path with
  an "Invalid .well-known request" 404 page. app.motionapp.com sits entirely behind Cloudflare Access
  and answers HTTP 200 with a "Sign in ・ Cloudflare Access" HTML shell for EVERY path including
  /.well-known/* — those 200s are NOT documents and are recorded as misses. help.motionapp.com is an
  Intercom-hosted help centre and the security.txt served there is INTERCOM'S OWN document
  (Canonical: https://app.intercom.com/.well-known/security.txt, Contact: security@intercom.com), not
  Motion's; it is recorded here for the record but is NOT credited to Motion and no SecurityTxt
  pointer is emitted.
